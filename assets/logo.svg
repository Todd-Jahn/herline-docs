<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Herline">
  <title>Herline — The AI engine for super individuals</title>
  <defs>
    <linearGradient id="herlineGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#5b8def"/>
    </linearGradient>
  </defs>
  <!--
    Stylized "H" mark: two pillars joined by a crossbar.
    The right pillar deliberately rises higher than the left — visual metaphor
    for elevation through Herline. Gradient ascends from indigo to brighter blue,
    reinforcing the upward motion.
  -->
  <rect x="20" y="22" width="10" height="54" rx="5" fill="url(#herlineGrad)"/>
  <rect x="30" y="42" width="36" height="10" rx="5" fill="url(#herlineGrad)" opacity="0.92"/>
  <rect x="66" y="10" width="10" height="66" rx="5" fill="url(#herlineGrad)"/>
</svg>
