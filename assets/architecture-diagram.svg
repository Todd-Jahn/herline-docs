  <rect x="150" y="470" width="660" height="74" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="480" y="499" text-anchor="middle" font-size="17" font-weight="650" fill="#1e293b">Supporting experiences</text>
  <text x="480" y="525" text-anchor="middle" font-size="14" fill="#64748b">Assistant + Harmon · Hypatia research workspace · role-scoped operator tools</text>
  <text x="480" y="580" text-anchor="middle" font-size="12" fill="#94a3b8">This diagram is a public responsibility map, not a deployment topology or release guarantee.</text>
