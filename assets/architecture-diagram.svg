    </marker>
  </defs>
  <rect width="960" height="600" rx="24" fill="#ffffff"/>
  <text x="480" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Herline Public Product Map</text>
  <text x="480" y="76" text-anchor="middle" font-size="14" fill="#64748b">Learning and expression loops; availability varies by role, account and region</text>

  <g fill="url(#bg)" stroke="#818cf8" stroke-width="1.5">
    <rect x="70" y="120" width="240" height="100" rx="14"/>
    <rect x="360" y="120" width="240" height="100" rx="14"/>
    <rect x="650" y="120" width="240" height="100" rx="14"/>
    <rect x="70" y="300" width="240" height="100" rx="14"/>
    <rect x="360" y="300" width="240" height="100" rx="14"/>
    <rect x="650" y="300" width="240" height="100" rx="14"/>
  </g>

  <g fill="#1e293b" font-size="18" font-weight="650" text-anchor="middle">
    <text x="190" y="158">Assessment + Atlas</text>
    <text x="480" y="158">Library + Helena</text>
    <text x="770" y="158">Studio + Holly</text>
    <text x="190" y="338">Courses</text>
    <text x="480" y="338">Prep + Hera</text>
    <text x="770" y="338">Boost + Hylia</text>
  </g>
  <g fill="#64748b" font-size="13" text-anchor="middle">
    <text x="190" y="186">Understand goals and plan reading</text>
    <text x="480" y="186">Discover and work with sources</text>
    <text x="770" y="186">Shape course and content blueprints</text>
    <text x="190" y="366">Learn through structured experiences</text>
    <text x="480" y="366">Turn evidence into presentations</text>
    <text x="770" y="366">Adapt approved work for channels</text>
  </g>

